<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توقعات مباريات اليوم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap">
<style>
:root{--bg:#f2f4f1;--ink:#16231c;--mute:#5d6b63;--card:#fff;--line:#dfe4de;--h:#1f6f4a;--d:#b8bfb5;--a:#c7782b}
@media (prefers-color-scheme:dark){:root{--bg:#101712;--ink:#e8efe9;--mute:#98a89d;--card:#18221b;--line:#26332a;--h:#3fae7a;--d:#566259;--a:#e09447}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Tajawal,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:2rem;font-weight:800;margin:0}
.sub{color:var(--mute);margin:4px 0 24px;font-size:.9rem}
h2{font-size:1.05rem;font-weight:800;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.t{display:flex;align-items:center;gap:8px;font-weight:500}
.t.a{justify-content:flex-end}
.t img{width:26px;height:26px;object-fit:contain}
.sc{text-align:center;min-width:92px}
.sc b{font-size:1.7rem;font-weight:800;letter-spacing:2px;direction:ltr;display:block;line-height:1.1}
.sc small{color:var(--mute);font-size:.75rem}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 6px;direction:ltr}
.bar i{display:block}
.lg{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute)}
.lg b{color:var(--ink)}
.res{margin-top:8px;font-size:.82rem;color:var(--mute)}
.empty{padding:40px 0;text-align:center;color:var(--mute)}
footer{margin-top:32px;font-size:.8rem;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<main>
<h1>مباريات اليوم وتوقعاتها</h1>
<p class="sub" id="up">جارٍ التحميل…</p>
<div id="list"></div>
<footer>التوقعات تحليل إحصائي (نموذج بواسون) مبني على نتائج الموسم، ولا تضمن أي نتيجة. المراهنة تحمل خطر الخسارة، ولا تراهن بما لا تستطيع خسارته. تأكد من قوانين بلدك.</footer>
</main>
<script>
const fmt = d => new Date(d).toLocaleTimeString('ar', {hour:'2-digit', minute:'2-digit'});
const team = (n, c, cls) => `<div class="t ${cls}">${cls==='h'?`${c?`<img src="${c}" alt="">`:''}<span>${n}</span>`:`<span>${n}</span>${c?`<img src="${c}" alt="">`:''}`}</div>`;
fetch('predictions.json?v=' + Date.now()).then(r => r.json()).then(d => {
  const up = document.getElementById('up'), list = document.getElementById('list');
  up.textContent = d.updated ? 'آخر تحديث: ' + new Date(d.updated).toLocaleString('ar') : 'لم يتم التحديث بعد';
  if (!d.matches.length) { list.innerHTML = '<div class="empty">لا توجد مباريات في الدوريات المغطاة اليوم.</div>'; return; }
  const by = {};
  d.matches.forEach(m => (by[m.league] ||= []).push(m));
  list.innerHTML = Object.entries(by).map(([lg, ms]) => `<h2>${lg}</h2>` + ms.map(m => {
    const [h, x, a] = m.p;
    const done = m.result ? `النتيجة الفعلية: ${m.result[0]} - ${m.result[1]}` : '';
    return `<div class="m"><div class="row">${team(m.home, m.crest_h, 'h')}
      <div class="sc"><small>${fmt(m.time)}</small><b>${m.score[0]} - ${m.score[1]}</b><small>النتيجة المرجحة</small></div>
      ${team(m.away, m.crest_a, 'a')}</div>
      <div class="bar"><i style="width:${h}%;background:var(--h)"></i><i style="width:${x}%;background:var(--d)"></i><i style="width:${a}%;background:var(--a)"></i></div>
      <div class="lg"><span>فوز المضيف <b>${h}%</b></span><span>تعادل <b>${x}%</b></span><span>فوز الضيف <b>${a}%</b></span></div>
      ${done ? `<div class="res">${done}</div>` : ''}</div>`;
  }).join('')).join('');
}).catch(() => document.getElementById('up').textContent = 'تعذر تحميل البيانات');
</script>
</body>
</html>
